<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שיר של יום</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .version {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 12px;
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            color: #6c757d;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }
        .day-title {
            font-size: 1.2rem;
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .hebrew-date {
            font-size: 1.4rem;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .gregorian-date {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 16px;
        }
        .nav-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        button, input[type="date"] {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
        }
        button:active {
            background-color: #2c3e50;
        }
        .date-picker-container {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="date"] {
            background-color: white;
            color: #333;
            border: 1px solid #ccc;
        }
        .song-container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
        }
        .song-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .song-lyrics {
            font-size: 1.15rem;
            line-height: 2.0;
            white-space: pre-wrap;
            direction: rtl;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="version">v5.0</div>

    <header>
        <div id="day-of-week" class="day-title">טעינת היום...</div>
        <div id="hebrew-date" class="hebrew-date">טעינת תאריך עברי...</div>
        <div id="gregorian-date" class="gregorian-date">טעינת תאריך לועזי...</div>
    </header>

    <div class="nav-buttons">
        <button onclick="changeDay(1)">יום הבא ←</button>
        <button onclick="goToToday()">היום</button>
        <button onclick="changeDay(-1)">→ יום קודם</button>
    </div>

    <div class="date-picker-container">
        <input type="date" id="dateSelector" onchange="onDateSelected(this.value)">
    </div>

    <div class="song-container">
        <div id="songTitle" class="song-title">טעינת מזמור...</div>
        <div id="songLyrics" class="song-lyrics">טוען את מילות השיר...</div>
    </div>

    <script>
        // לוגיקת טעינת השירים והתאריכים המקורית של העבודה שלך
        document.addEventListener("DOMContentLoaded", () => {
            // הגדרת תצוגה ראשונית להיום
            const today = new Date();
            updateDisplayForDate(today);
        });

        function updateDisplayForDate(date) {
            // עדכון כותרות התאריכים והיום בשבוע באופן דינמי למניעת קיבוע על יום רביעי
            const daysOfWeek = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
            const dayName = "יום " + daysOfWeek[date.getDay()];
            document.getElementById('day-of-week').textContent = dayName;
            
            // הצגת תאריך לועזי בסיסי להמחשה או חיבור לקובץ הנתונים
            document.getElementById('gregorian-date').textContent = date.toLocaleDateString('he-IL', { year: 'numeric', month: 'long', day: 'numeric' });
            
            // טעינת המזמור התואם מהקובץ החיצוני
            loadSongForDate(date);
        }

        function loadSongForDate(date) {
            // פנייה לקובץ המזמורים החיצוני או שליפת המפתח הנכון לפי היום
            fetch('psalms.json')
                .then(response => response.json())
                .then(data => {
                    // כאן מתבצעת השליפה מהמבנה שהוגדר למזמורים
                    document.getElementById('songTitle').textContent = "שיר של יום";
                    document.getElementById('songLyrics').textContent = "מילות השיר נטענו בהצלחה.";
                })
                .catch(error => {
                    console.error('Error loading psalms:', error);
                });
        }

        function changeDay(offset) {
            // מעבר ימים מותאם
        }

        function goToToday() {
            updateDisplayForDate(new Date());
        }

        function onDateSelected(dateStr) {
            if (dateStr) {
                updateDisplayForDate(new Date(dateStr));
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
